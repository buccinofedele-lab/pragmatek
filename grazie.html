/* Stesse variabili e stesso font della pagina negozianti. */
:root{
  --ink:#15171B;
  --panna:#FDF7EF;
  --crema:#F5E9D8;
  --testo:#1B1D21;
  --testo-chiaro:#5F6670;

*{box-sizing:border-box;margin:0;padding:0}

}

.torna{
  display:inline-block;margin-top:30px;
  color:var(--accent);font-weight:700;font-size:19px;text-decoration:none
}
.torna:hover,.torna:active{text-decoration:underline}
